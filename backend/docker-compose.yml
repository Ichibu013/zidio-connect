version: '3.8'

volumes:
  zidio-mysql-data:

services:
  mysqldb:
    image: mysql:8.0
    restart: always
    networks:
      - zidio-network
    environment:
      - MYSQL_DATABASE=zidio_connect
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3307:3306"
    volumes:
      - zidio-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      start_period: 40s
      interval: 10s

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-gateway
    image: zidio-connect-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/zidio_connect?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - EMAIL_USERNAME=noreply.e.veda@gmail.com
      - EMAIL_PASSWORD=uygd nltv pbek bomc
    depends_on:
      - mysqldb
      - service-admin
      - service-user
      - service-application
      - service-job
      - service-analytics
    networks:
      - zidio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  service-admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: service-admin
    image: zidio-connect-service-admin
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/zidio_connect?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
    depends_on:
      - mysqldb
    networks:
      - zidio-network

  service-user:
    build:
      context: .
      dockerfile: Dockerfile
      target: service-user
    image: zidio-connect-service-user
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/zidio_connect?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - CLOUDINARY_URL=cloudinary://318266137966868:iVm5HeOd_lrStCvJCd4lbzS79Ds@dxuhcimdw
      - CLOUDINARY_NAME=dxuhcimdw
      - CLOUDINARY_API_KEY=318266137966868
      - CLOUDINARY_API_SECRET=iVm5HeOd_lrStCvJCd4lbzS79Ds
      - CLOUDINARY_PREFIX=zidio-connect/
    depends_on:
      - mysqldb
    networks:
      - zidio-network

  service-application:
    build:
      context: .
      dockerfile: Dockerfile
      target: service-application
    image: zidio-connect-service-application
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/zidio_connect?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
    depends_on:
      - mysqldb
    networks:
      - zidio-network

  service-job:
    build:
      context: .
      dockerfile: Dockerfile
      target: service-job
    image: zidio-connect-service-job
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/zidio_connect?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
    depends_on:
      - mysqldb
    networks:
      - zidio-network

  service-analytics:
    build:
      context: .
      dockerfile: Dockerfile
      target: service-analytics
    image: zidio-connect-service-analytics
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/zidio_connect?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8085
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
    depends_on:
      - mysqldb
    networks:
      - zidio-network

networks:
  zidio-network:
    driver: bridge
